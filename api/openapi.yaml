        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      description: "Required permission: `privacy:manage`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataRequest"
  /v1/workspaces/{workspaceId}/data-requests/{requestId}/cancel:
    post:
      tags:
        - Privacy
      summary: Cancel a scheduled deletion
      operationId: post_v1_workspaces_workspaceId_data_requests_requestId_cancel
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      description: "Required permission: `privacy:manage`."
  /v1/webhooks/messaging/{provider}:
    post:
      tags:
        - Webhooks
      summary: Provider status callback (HMAC-signed raw body, replay window 5 min)
      operationId: post_v1_webhooks_messaging_provider
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/E401"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
      security: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sc_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Value returned by login/register//v1/auth/me; required on POST/PUT/PATCH/DELETE
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  field:
                    type: string
                  message:
                    type: string
                required: []
          required:
            - code
            - message
            - requestId
      required:
        - error
    Register:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        workspaceName:
          type: string
          minLength: 1
          maxLength: 160
      required:
        - email
        - password
        - displayName
    Login:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    CreateWorkspace:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
      required:
        - name
    UpdateWorkspace:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        quietHoursStart:
          type: integer
          minimum: 0
          maximum: 23
        quietHoursEnd:
          type: integer
          minimum: 0
          maximum: 23
        messageSpendCapPaise:
          type:
            - integer
            - "null"
          minimum: 0
      required: []
    Attestation:
      type: object
      additionalProperties: false
      properties:
        confirm:
          type: boolean
          enum:
            - true
      required:
        - confirm
    Role:
      type: string
      enum:
        - owner
        - organizer
        - planner
        - checkin_staff
        - readonly
        - caterer
    AddMember:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
      required:
        - email
        - role
    UpdateMember:
      type: object
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/Role"
      required:
        - role
    Assignments:
      type: object
      additionalProperties: false
      properties:
        eventIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 200
        functionIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 500
      required: []
    CreateEvent:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        timezone:
          type: string
          example: Asia/Kolkata
          description: IANA time zone
        startDate:
          type:
            - string
            - "null"
          format: date
        endDate:
          type:
            - string
            - "null"
          format: date
        hostName:
          type:
            - string
            - "null"
          maxLength: 160
      required:
        - name
    UpdateEvent:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        timezone:
          type: string
        startDate:
          type:
            - string
            - "null"
          format: date
        endDate:
          type:
            - string
            - "null"
          format: date
        hostName:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - draft
            - active
            - completed
            - cancelled
            - archived
      required: []
    CreateFunction:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        startsAt:
          type: string
          description: Event-local "2027-02-10T17:00" or RFC 3339 instant with offset
        venue:
          type:
            - string
            - "null"
        capacity:
          type:
            - integer
            - "null"
          minimum: 0
        rsvpDeadline:
          type:
            - string
            - "null"
        allowResponseEdits:
          type: boolean
          default: true
        allowChildren:
          type: boolean
          default: true
        status:
          type: string
          enum:
            - draft
            - active
            - cancelled
            - completed
          default: active
      required:
        - name
        - startsAt
    CreateGuest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        phone:
          type:
            - string
            - "null"
          description: Normalised to E.164; 10-digit Indian mobiles default to +91
        email:
          type:
            - string
            - "null"
        preferredLanguage:
          type: string
          enum:
            - en
            - hi
        groupId:
          type:
            - string
            - "null"
          format: uuid
        groupLabel:
          type: string
          minLength: 1
          maxLength: 120
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 40
          maxItems: 10
        allowDuplicate:
          type: boolean
          default: false
        invitations:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              functionId:
                type: string
                format: uuid
              partySize:
                type: integer
                minimum: 1
                maximum: 50
            required:
              - functionId
      required:
        - displayName
    UpdateGuest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        phone:
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
        preferredLanguage:
          type: string
          enum:
            - en
            - hi
        groupId:
          type:
            - string
            - "null"
          format: uuid
        groupLabel:
          type: string
          minLength: 1
          maxLength: 120
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 40
      required: []
    Group:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - label
    Consent:
      type: object
      additionalProperties: false
      properties:
        guestIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 1000
        channel:
          type: string
          enum:
            - whatsapp
            - sms
            - email
        status:
          type: string
          enum:
            - granted
            - revoked
        basis:
          type: string
          enum:
            - organizer_attestation
            - guest_opt_in
        evidenceNote:
          type: string
          minLength: 3
          maxLength: 500
      required:
        - guestIds
        - channel
        - basis
        - evidenceNote
    ImportPreview:
      type: object
      additionalProperties: false
      properties:
        csv:
          type: string
          description: CSV text, max ~900 KB / 5000 rows
        filename:
          type: string
        mapping:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
            phone:
              type: string
            email:
              type: string
            language:
              type: string
            group:
              type: string
            functions:
              type: string
            partySize:
              type: string
            tags:
              type: string
          required: []
      required:
        - csv
    ImportCommit:
      type: object
      additionalProperties: false
      properties:
        includeDuplicateRows:
          type: array
          items:
            type: integer
            minimum: 2
      required: []
    CreateInvitations:
      type: object
      additionalProperties: false
      properties:
        invites:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            properties:
              guestId:
                type: string
                format: uuid
              partySize:
                type: integer
                minimum: 1
                maximum: 50
            required:
              - guestId
      required:
        - invites
    UpdateInvitation:
      type: object
      additionalProperties: false
      properties:
        partySize:
          type: integer
          minimum: 1
          maximum: 50
      required:
        - partySize
    Reason:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 300
      required: []
    RsvpSubmit:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - yes
            - no
            - maybe
        adultCount:
          type: integer
          minimum: 0
          maximum: 100
        childCount:
          type: integer
          minimum: 0
          maximum: 100
        version:
          type: integer
          minimum: 0
          description: 0 for a first response, otherwise the version last seen
      required:
        - status
        - version
    RsvpOverride:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - yes
            - no
            - maybe
        adultCount:
          type: integer
          minimum: 0
          maximum: 100
        childCount:
          type: integer
          minimum: 0
          maximum: 100
        version:
          type: integer
          minimum: 0
          maximum: 1000000000
        reason:
          type: string
          minLength: 3
          maxLength: 300
        allowExceedPartySize:
          type: boolean
      required:
        - status
        - reason
    PublicRsvpView:
      type: object
      additionalProperties: false
      properties:
        guestName:
          type: string
        language:
          type: string
          enum:
            - en
            - hi
        event:
          type: object
          additionalProperties: true
        function:
          type: object
          additionalProperties: true
        partySizeMax:
          type: integer
        allowChildren:
          type: boolean
        deadline:
          type:
            - string
            - "null"
        state:
          type: string
          enum:
            - open
            - locked
            - closed_deadline
            - closed_cancelled
            - closed_completed
        response:
          type:
            - object
            - "null"
          additionalProperties: true
        checkinCode:
          type:
            - string
            - "null"
      required: []
    CateringSettings:
      type: object
      additionalProperties: false
      properties:
        maybeWeightPercent:
          type: number
          minimum: 0
          maximum: 100
        pendingWeightPercent:
          type: number
          minimum: 0
          maximum: 100
        bufferPercent:
          type: number
          minimum: 0
          maximum: 100
        mealRounding:
          type: integer
          minimum: 1
          maximum: 100
        adultPricePaise:
          type:
            - integer
            - "null"
          minimum: 0
        childPricePaise:
          type:
            - integer
            - "null"
          minimum: 0
      required: []
    Snapshot:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
      required: []
    Export:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - guests
            - rsvps
            - catering
            - checkins
        functionId:
          type: string
          format: uuid
      required:
        - kind
    CreateCampaign:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        kind:
          type: string
          enum:
            - invitation
            - reminder
        channel:
          type: string
          enum:
            - whatsapp
            - sms
            - email
        templateKey:
          type: string
        audience:
          type: string
          enum:
            - all_invited
            - not_responded
            - maybe
            - not_yet_messaged
      required:
        - name
        - kind
    ScheduleCampaign:
      type: object
      additionalProperties: false
      properties:
        scheduledAt:
          type: string
        confirmRecipientCount:
          type: integer
          minimum: 0
          maximum: 1000000000
        confirmEstimatedCostPaise:
          type: integer
          minimum: 0
          maximum: 1000000000000
      required:
        - confirmRecipientCount
        - confirmEstimatedCostPaise
    RequiredReason:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 300
      required:
        - reason
    Simulate:
      type: object
      additionalProperties: false
      properties:
        event:
          type: string
          enum:
            - delivered
            - read
            - failed
            - opted_out
      required:
        - event
    CheckIn:
      type: object
      additionalProperties: false
      properties:
        invitationId:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^[A-Z2-9]{12}$
        adults:
          type: integer
          minimum: 0
          maximum: 100
        children:
          type: integer
          minimum: 0
          maximum: 100
        allowUnconfirmed:
          type: boolean
        note:
          type: string
          minLength: 1
          maxLength: 300
      required: []
    AddSuppression:
      type: object
      additionalProperties: false
      properties:
        channel:
          type: string
          enum:
            - whatsapp
            - sms
            - email
        contact:
          type: string
          minLength: 3
          maxLength: 254
        reason:
          type: string
          enum:
            - opted_out
            - organizer_added
            - bounce
            - complaint
      required:
        - channel
        - contact
    LiftSuppression:
      type: object
      additionalProperties: false
      properties:
        liftReason:
          type: string
          minLength: 3
          maxLength: 300
      required:
        - liftReason
    DataRequest:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - export
            - deletion
        confirmWorkspaceName:
          type: string
      required:
        - type
    WebhookEvent:
      type: object
      additionalProperties: false
      properties:
        eventId:
          type: string
          minLength: 8
          maxLength: 100
        type:
          type: string
          enum:
            - submitted
            - delivered
            - read
            - failed
            - opted_out
        providerMessageId:
          type: string
          minLength: 3
          maxLength: 200
        occurredAt:
          type: string
          format: date-time
        errorCode:
          type: string
      required:
        - eventId
        - type
        - providerMessageId
  responses:
    E400:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E401:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E403:
      description: Forbidden (role, CSRF or origin)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E404:
      description: Not found (also used for other tenants' resources)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E409:
      description: Conflict (version, duplicate, state)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E410:
      description: Gone (revoked/expired)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E413:
      description: Body too large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E422:
      description: Validation or business rule failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E429:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
