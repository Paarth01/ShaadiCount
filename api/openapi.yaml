openapi: 3.1.0
info:
  title: ShaadiCount API
  version: 0.1.0
  description: "Versioned REST API for the ShaadiCount MVP. Session cookie (HttpOnly) + X-CSRF-Token header on every state-changing request. Workspace is always taken from the URL and verified against the caller's membership server-side; non-members receive a generic 404. Real WhatsApp/SMS sending is disabled by default: the fake provider is used unless every live safeguard is configured."
servers:
  - url: http://localhost:4000
    description: Local API (the web app proxies /v1 to it)
tags:
  - name: System
  - name: Auth
  - name: Workspaces
  - name: Team
  - name: Audit
  - name: Events
  - name: Functions
  - name: Guests
  - name: Messaging
  - name: Import
  - name: Invitations
  - name: RSVP
  - name: Public RSVP
  - name: Reporting
  - name: Catering
  - name: Exports
  - name: Check-in
  - name: Privacy
  - name: Webhooks
security:
  - cookieAuth: []
    csrfToken: []
paths:
  /v1/health:
    get:
      tags:
        - System
      summary: Liveness probe
      operationId: get_v1_health
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "410":
          $ref: "#/components/responses/E410"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      security: []
  /v1/health/ready:
    get:
      tags:
        - System
      summary: Readiness probe (checks the database)
      operationId: get_v1_health_ready
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "410":
          $ref: "#/components/responses/E410"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      security: []
  /v1/auth/register:
    post:
      tags:
        - Auth
      summary: Create an account (optionally with a first workspace)
      operationId: post_v1_auth_register
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "410":
          $ref: "#/components/responses/E410"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Register"
      security: []
  /v1/auth/login:
    post:
      tags:
        - Auth
      summary: Log in; sets an HttpOnly session cookie and returns a CSRF token
      operationId: post_v1_auth_login
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "410":
          $ref: "#/components/responses/E410"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      security: []
  /v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Log out and revoke the session
      operationId: post_v1_auth_logout
      responses:
        "204":
          description: No content
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
  /v1/auth/me:
    get:
      tags:
        - Auth
      summary: Current user, workspaces and a fresh CSRF token
      operationId: get_v1_auth_me
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
  /v1/workspaces:
    get:
      tags:
        - Workspaces
      summary: Workspaces the caller belongs to
      operationId: get_v1_workspaces
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
    post:
      tags:
        - Workspaces
      summary: Create a workspace (caller becomes owner)
      operationId: post_v1_workspaces
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspace"
  /v1/workspaces/{workspaceId}:
    get:
      tags:
        - Workspaces
      summary: Workspace details and messaging mode
      operationId: get_v1_workspaces_workspaceId
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      description: "Required permission: `workspace:read`."
    patch:
      tags:
        - Workspaces
      summary: Update name, quiet hours, spend cap
      operationId: patch_v1_workspaces_workspaceId
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      description: "Required permission: `workspace:manage`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspace"
  /v1/workspaces/{workspaceId}/contact-authority-attestation:
    post:
      tags:
        - Workspaces
      summary: Attest authority to contact uploaded guests (required before scheduling messages)
      operationId: post_v1_workspaces_workspaceId_contact_authority_attestation
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      description: "Required permission: `workspace:attest`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Attestation"
  /v1/workspaces/{workspaceId}/members:
    get:
      tags:
        - Team
      summary: List members and assignments
      operationId: get_v1_workspaces_workspaceId_members
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      description: "Required permission: `members:read`."
    post:
      tags:
        - Team
      summary: Add a registered user with a role
      operationId: post_v1_workspaces_workspaceId_members
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      description: "Required permission: `members:manage`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMember"
  /v1/workspaces/{workspaceId}/members/{userId}:
    patch:
      tags:
        - Team
      summary: Change a role
      operationId: patch_v1_workspaces_workspaceId_members_userId
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      description: "Required permission: `members:manage`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMember"
    delete:
      tags:
        - Team
      summary: Remove a member (access ends immediately)
      operationId: delete_v1_workspaces_workspaceId_members_userId
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No content
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      description: "Required permission: `members:manage`."
  /v1/workspaces/{workspaceId}/members/{userId}/assignments:
    put:
      tags:
        - Team
      summary: Replace event/function assignments for scoped roles
      operationId: put_v1_workspaces_workspaceId_members_userId_assignments
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      description: "Required permission: `members:manage`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Assignments"
  /v1/workspaces/{workspaceId}/usage:
    get:
      tags:
        - Workspaces
      summary: Usage counters (no billing in the MVP)
      operationId: get_v1_workspaces_workspaceId_usage
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      description: "Required permission: `usage:read`."
  /v1/workspaces/{workspaceId}/audit-logs:
    get:
      tags:
        - Audit
      summary: Append-only audit log
      operationId: get_v1_workspaces_workspaceId_audit_logs
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: string
        - name: before
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      description: "Required permission: `audit:read`."
  /v1/workspaces/{workspaceId}/events:
    get:
      tags:
        - Events
      summary: List events visible to the caller
      operationId: get_v1_workspaces_workspaceId_events
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: includeArchived
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      description: "Required permission: `events:read`."
    post:
      tags:
        - Events
      summary: Create an event
      operationId: post_v1_workspaces_workspaceId_events
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      description: "Required permission: `events:create`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvent"
  /v1/workspaces/{workspaceId}/events/{eventId}:
    get:
      tags:
        - Events
      summary: Event with its functions
      operationId: get_v1_workspaces_workspaceId_events_eventId
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      description: "Required permission: `events:read`."
    patch:
      tags:
        - Events
      summary: Update an event or change its status
      operationId: patch_v1_workspaces_workspaceId_events_eventId
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      description: "Required permission: `events:write`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEvent"
  /v1/workspaces/{workspaceId}/events/{eventId}/functions:
    post:
      tags:
        - Functions
      summary: Create a function (times are event-local or offset instants)
      operationId: post_v1_workspaces_workspaceId_events_eventId_functions
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "429":
          $ref: "#/components/responses/E429"
      description: "Required permission: `events:write`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFunction"
  /v1/workspaces/{workspaceId}/events/{eventId}/functions/{functionId}:
    get:
      tags:
        - Functions
      summary: Function details (UTC + event-local times)
      operationId: get_v1_workspaces_workspaceId_events_eventId_functions_functionId
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: functionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
