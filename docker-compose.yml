# Local development and demo stack.
#   Database only (run API/web on your machine):  docker compose up -d postgres
#   Whole stack in containers:                    docker compose --profile app up --build
# Secrets come from .env (create it with `bash scripts/gen-env.sh`). The database password below is a LOCAL-ONLY development value.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shaadicount
      POSTGRES_PASSWORD: shaadicount_local_dev
      POSTGRES_DB: shaadicount_dev
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shaadicount -d shaadicount_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    profiles: [app]
    build: { context: ., dockerfile: Dockerfile.api }
    command: ["node", "apps/api/dist/db/migrate-cli.js"]
    env_file: .env
    environment: { DATABASE_URL: "postgres://shaadicount:shaadicount_local_dev@postgres:5432/shaadicount_dev" }
    depends_on: { postgres: { condition: service_healthy } }

  api:
    profiles: [app]
    build: { context: ., dockerfile: Dockerfile.api }
    env_file: .env
    environment:
      DATABASE_URL: "postgres://shaadicount:shaadicount_local_dev@postgres:5432/shaadicount_dev"
      NODE_ENV: development   # production would require HTTPS (Secure cookies); see docs/devops/deployment.md
      TRUST_PROXY: "1"
    ports: ["127.0.0.1:4000:4000"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:
    profiles: [app]
    build: { context: ., dockerfile: Dockerfile.api }
    command: ["node", "apps/api/dist/worker.js"]
    env_file: .env
    environment: { DATABASE_URL: "postgres://shaadicount:shaadicount_local_dev@postgres:5432/shaadicount_dev", NODE_ENV: development }
    depends_on: { migrate: { condition: service_completed_successfully } }

  web:
    profiles: [app]
    build: { context: ., dockerfile: Dockerfile.web, args: { API_URL: "http://api:4000" } }
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
